name: Проверка звонков
on:
  push:
    paths:
      - 'js/main.js'
      - 'js/calls.js'
      - 'tests/calls-ice.test.mjs'
      - '.github/workflows/calls-tests.yml'
  pull_request:
    paths:
      - 'js/main.js'
      - 'js/calls.js'
      - 'tests/calls-ice.test.mjs'
jobs:
  check-calls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Проверка синтаксиса
        run: |
          # ES-модули: обычный node --check проверяет файл как CommonJS и пропускает ошибки
          for f in js/*.js; do cp "$f" /tmp/check.mjs; node --check /tmp/check.mjs || exit 1; done
      - name: Тесты ICE
        run: node --test tests/calls-ice.test.mjs
