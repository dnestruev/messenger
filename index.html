<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мессенджер">

<link rel="stylesheet" href="css/styles.css?v=20261109191113">
<script>
  // Тема применяется до отрисовки, чтобы не было «вспышки»
  try {
    const p = JSON.parse(localStorage.getItem('prefs') || '{}');
    const mode = p.mode === 'auto' || !p.mode
      ? (p.theme === 'dark' ? 'dark' : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      : p.mode;
    const plusOnly = p.style === 'paper' || p.style === 'neon';
    document.documentElement.dataset.style = plusOnly && !p.plus ? 'classic' : p.style || 'classic';
    document.documentElement.dataset.mode = mode;
  } catch {}
</script>
</head>
<body>

<!-- Вход / регистрация -->
<section id="auth" class="auth" hidden>
  <form class="auth-card" id="authForm" novalidate>
    <div class="brand">
      <img src="icon-192.png" alt="" class="brand-icon">
      <div>
        <div class="brand-name">messenger</div>
        <div class="brand-sub" id="authSub">С возвращением</div>
      </div>
    </div>
    <div class="segmented" role="tablist">
      <button type="button" id="tabLogin" class="on" role="tab">Вход</button>
      <button type="button" id="tabSignup" role="tab">Регистрация</button>
    </div>
    <label class="field" id="usernameField" hidden>
      <span>Ник</span>
      <input id="username" placeholder="латиница, цифры, _" autocomplete="username" maxlength="24" autocapitalize="off" spellcheck="false">
    </label>
    <label class="field">
      <span>Email</span>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email" required>
    </label>
    <label class="field">
      <span>Пароль</span>
      <input id="password" type="password" placeholder="от 6 символов" autocomplete="current-password" minlength="6" required>
    </label>
    <button class="btn btn-primary" id="authBtn" type="submit">Войти</button>
    <p class="note" id="authMsg" role="status"></p>
  </form>
</section>

<!-- Основной экран -->
<section id="app" class="app" hidden>
  <aside class="sidebar">
    <header class="side-top">
      <button class="me" id="meBtn" title="Настройки">
        <span id="meAvatar"></span>
        <span class="me-text"><span class="me-name" id="meName"></span><span class="me-nick" id="meNick"></span></span>
      </button>
      <button class="icon-btn" id="shareBtn" title="Поделиться ником: QR и ссылка"><svg class="i"><use href="#i-qr"/></svg></button>
      <button class="icon-btn" id="modeBtn" title="Светлая / тёмная"><svg class="i"><use href="#i-moon"/></svg></button>
      <button class="icon-btn" id="settingsBtn" title="Настройки"><svg class="i"><use href="#i-settings"/></svg></button>
    </header>
    <div class="side-tools">
      <form class="search" id="findForm">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="findInput" placeholder="Ник друга" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
      </form>
      <button class="icon-btn icon-btn-accent" id="newGroupBtn" title="Новая группа"><svg class="i"><use href="#i-users"/></svg></button>
    </div>
    <p class="note" id="findMsg" role="status"></p>
    <div class="list-label" id="listLabel">Чаты</div>
    <div class="chat-list" id="chatList"></div>
  </aside>

  <main class="chat" id="chat">
    <header class="chat-top">
      <button class="icon-btn back" id="backBtn" title="Назад"><svg class="i"><use href="#i-back"/></svg></button>
      <button class="chat-info" id="chatInfo" title="О чате">
        <span id="chatAvatar"></span>
        <span class="chat-info-text">
          <span class="chat-title" id="chatTitle"></span>
          <span class="chat-sub" id="chatStatus"></span>
        </span>
      </button>
      <button class="icon-btn call-btn" id="callAudioBtn" title="Позвонить" hidden><svg class="i"><use href="#i-phone"/></svg></button>
      <button class="icon-btn call-btn" id="callVideoBtn" title="Видеозвонок" hidden><svg class="i"><use href="#i-video"/></svg></button>
    </header>
    <div class="placeholder" id="placeholder">
      <div class="placeholder-mark"><svg class="i"><use href="#i-chat"/></svg></div>
      <h2>Выберите чат</h2>
      <p>Найдите друга по нику или создайте группу.</p>
    </div>
    <div class="messages" id="messages" hidden></div>
    <div class="uploading" id="uploading" hidden>Отправляю…</div>
    <div class="locked-bar" id="lockedBar" hidden></div>
    <div class="compose-bar" id="composeBar" hidden>
      <svg class="i" id="composeIcon"><use href="#i-reply"/></svg>
      <div class="compose-bar-text"><b id="composeTitle"></b><span id="composeText"></span></div>
      <button class="icon-btn" id="composeCancel" type="button" title="Отменить"><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <form class="composer" id="composer" hidden>
      <label class="icon-btn" title="Фото"><svg class="i"><use href="#i-attach"/></svg><input type="file" id="fileInput" accept="image/*" hidden></label>
      <textarea id="text" rows="1" placeholder="Сообщение" autocomplete="off" maxlength="4000" enterkeyhint="send"></textarea>
      <button type="submit" class="send" id="sendBtn" title="Отправить"><svg class="i"><use href="#i-send"/></svg></button>
      <button type="button" class="send mic" id="micBtn" title="Голосовое сообщение"><svg class="i"><use href="#i-mic"/></svg></button>
      <div class="rec-bar" id="recBar" hidden>
        <button type="button" class="icon-btn rec-cancel" id="recCancel" title="Отменить"><svg class="i"><use href="#i-trash"/></svg></button>
        <span class="rec-dot"></span><span class="rec-time" id="recTime">0:00</span>
        <div class="rec-wave" id="recWave"></div>
        <button type="button" class="send" id="recSend" title="Отправить голосовое"><svg class="i"><use href="#i-send"/></svg></button>
      </div>
    </form>
  </main>
</section>

<div id="modalRoot"></div>

<div id="configWarn" class="config-warn" hidden>
  <h2>Почти готово</h2>
  <p>Откройте файл <b>config.js</b> и вставьте туда адрес проекта и ключ из Supabase. Подробно — в README.md.</p>
</div>

<script type="module" src="js/main.js?v=20261109191113"></script>
</body>
</html>
