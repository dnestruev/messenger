<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мессенджер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f1ff; --bg2: #ffe9f3;
    --panel: #ffffff; --panel2: #f6f4fb; --line: #ece8f5;
    --text: #2b2540; --muted: #8a84a3;
    --accent: #7c5cff; --accent2: #ff6fa8;
    --theirs: #ffffff; --chatbg: #f7f5fd;
    --err: #e5484d; --ok: #2fa86b;
    --shadow: 0 10px 40px rgba(92, 64, 180, .12);
  }
  body.dark {
    --bg: #15121f; --bg2: #1d1530;
    --panel: #1d1a29; --panel2: #262236; --line: #2f2a42;
    --text: #efeaff; --muted: #9b93b8;
    --theirs: #2a2540; --chatbg: #17141f;
    --shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: linear-gradient(135deg, var(--bg), var(--bg2)); color: var(--text);
    font: 15px/1.45 "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    transition: background .3s, color .3s; }
  button { font: inherit; cursor: pointer; border: 0; border-radius: 14px; color: inherit; background: none; }
  input { font: inherit; color: var(--text); background: var(--panel2); border: 2px solid transparent;
    border-radius: 14px; padding: 12px 14px; outline: none; width: 100%; transition: border-color .2s, background .2s; }
  input::placeholder { color: var(--muted); }
  input:focus { border-color: var(--accent); background: var(--panel); }
  .hidden { display: none !important; }
  .grad { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; }

  /* ---------- Вход ---------- */
  #auth { min-height: 100%; display: grid; place-items: center; padding: 20px; }
  .card { width: 100%; max-width: 380px; background: var(--panel); border-radius: 28px; padding: 32px 28px;
    display: grid; gap: 14px; box-shadow: var(--shadow); animation: pop .4s ease; }
  .logo { width: 72px; height: 72px; border-radius: 24px; display: grid; place-items: center; font-size: 36px;
    margin: 0 auto 4px; box-shadow: 0 8px 24px rgba(124, 92, 255, .35); }
  .card h1 { margin: 0; font-size: 26px; font-weight: 800; text-align: center; }
  .card .sub { margin: -6px 0 6px; text-align: center; color: var(--muted); }
  .tabs { display: flex; gap: 4px; background: var(--panel2); padding: 5px; border-radius: 16px; }
  .tabs button { flex: 1; padding: 9px; color: var(--muted); font-weight: 700; border-radius: 12px; }
  .tabs button.on { background: var(--panel); color: var(--accent); box-shadow: 0 2px 10px rgba(92, 64, 180, .12); }
  .primary { padding: 13px; font-weight: 800; font-size: 16px; transition: transform .1s, filter .2s; }
  .primary:hover { filter: brightness(1.05); }
  .primary:active { transform: scale(.98); }
  .primary:disabled { opacity: .6; cursor: default; }
  .secondary { padding: 11px 14px; font-weight: 700; background: var(--panel2); }
  .secondary:hover { background: var(--line); }
  .danger { color: var(--err); }
  .msg { font-size: 14px; min-height: 1em; text-align: center; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }

  /* ---------- Приложение ---------- */
  #app { height: 100%; display: flex; padding: 16px; gap: 16px; }
  #sidebar { width: 340px; flex-shrink: 0; background: var(--panel); border-radius: 24px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; overflow: hidden; }
  .side-head { padding: 18px 16px 12px; display: grid; gap: 12px; }
  .me { display: flex; align-items: center; gap: 10px; }
  .me .who { flex: 1; min-width: 0; cursor: pointer; }
  .me .hi { font-size: 13px; color: var(--muted); }
  .me b { font-size: 17px; font-weight: 800; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icon-btn { width: 38px; height: 38px; display: grid; place-items: center; background: var(--panel2); font-size: 17px;
    border-radius: 12px; flex-shrink: 0; transition: background .2s; }
  .icon-btn:hover { background: var(--line); }
  .search-row { display: flex; gap: 8px; }
  .find { position: relative; flex: 1; }
  .find input { padding-left: 40px; }
  .find::before { content: "🔍"; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; opacity: .6; }
  .new-group { width: 48px; font-size: 20px; border-radius: 14px; flex-shrink: 0; }
  .side-title { padding: 4px 18px 6px; font-size: 12px; font-weight: 800; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); }
  #chatList { overflow-y: auto; flex: 1; padding: 0 8px 8px; }
  .chat-item { padding: 10px; border-radius: 16px; cursor: pointer; display: flex; gap: 12px; align-items: center;
    transition: background .15s; }
  .chat-item:hover { background: var(--panel2); }
  .chat-item.active { background: linear-gradient(135deg, rgba(124, 92, 255, .14), rgba(255, 111, 168, .12)); }
  .avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center;
    font-weight: 800; font-size: 18px; flex-shrink: 0; color: #fff; position: relative; }
  .avatar.sm { width: 40px; height: 40px; font-size: 16px; }
  .avatar.xs { width: 32px; height: 32px; font-size: 13px; }
  .avatar.lg { width: 84px; height: 84px; font-size: 34px; }
  .avatar .grp { position: absolute; right: -2px; bottom: -2px; font-size: 12px; background: var(--panel);
    border-radius: 50%; width: 20px; height: 20px; display: grid; place-items: center; }
  .chat-meta { min-width: 0; flex: 1; }
  .chat-name { font-weight: 700; display: flex; justify-content: space-between; gap: 6px; }
  .chat-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-name small { color: var(--muted); font-weight: 600; font-size: 12px; flex-shrink: 0; }
  .chat-last { color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item.unread .chat-last { color: var(--text); font-weight: 700; }
  .dot { min-width: 10px; height: 10px; border-radius: 50%; background: var(--accent2); flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(255, 111, 168, .2); }
  .empty { color: var(--muted); padding: 28px 16px; font-size: 14px; text-align: center; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 8px; }

  #chat { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel);
    border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
  .chat-head { padding: 12px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center;
    gap: 12px; min-height: 68px; }
  .chat-head .info { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 12px; }
  .chat-head .title { font-weight: 800; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-head .status { font-size: 12.5px; color: var(--muted); }
  #backBtn { display: none; }
  #messages { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px;
    background: var(--chatbg);
    background-image: radial-gradient(rgba(124, 92, 255, .07) 1px, transparent 1px); background-size: 22px 22px; }
  .bubble { max-width: min(72%, 560px); padding: 9px 14px 6px; border-radius: 20px 20px 20px 6px;
    background: var(--theirs); align-self: flex-start; white-space: pre-wrap; word-wrap: break-word;
    box-shadow: 0 2px 6px rgba(60, 40, 120, .08); animation: pop .2s ease; }
  .bubble.mine { background: linear-gradient(135deg, var(--accent), #9b6bff); color: #fff;
    align-self: flex-end; border-radius: 20px 20px 6px 20px; }
  .bubble .from { font-size: 12.5px; font-weight: 800; margin-bottom: 2px; }
  .bubble time { display: block; font-size: 11px; opacity: .6; text-align: right; margin-top: 1px; }
  .bubble.photo { padding: 4px 4px 6px; }
  .bubble.photo .from { padding: 4px 10px 0; }
  .bubble.photo .cap { padding: 4px 10px 0; }
  .bubble.photo time { padding: 0 10px; }
  .bubble img { display: block; max-width: min(300px, 100%); max-height: 340px; min-width: 120px; min-height: 80px;
    border-radius: 16px; cursor: zoom-in; background: var(--panel2); object-fit: cover; }
  .day { align-self: center; color: var(--muted); font-size: 12px; font-weight: 700; margin: 10px 0;
    background: var(--panel); padding: 4px 12px; border-radius: 999px; box-shadow: 0 1px 4px rgba(60, 40, 120, .08); }
  #composer { display: flex; gap: 10px; padding: 14px; border-top: 1px solid var(--line); align-items: center; }
  #composer input[type=text] { border-radius: 999px; padding: 12px 18px; }
  #composer .send { width: 48px; height: 48px; border-radius: 50%; font-size: 20px; flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(124, 92, 255, .35); transition: transform .1s; }
  #composer .send:active { transform: scale(.92); }
  #composer .attach { width: 44px; height: 44px; border-radius: 50%; font-size: 20px; flex-shrink: 0;
    background: var(--panel2); display: grid; place-items: center; cursor: pointer; }
  #composer .attach:hover { background: var(--line); }
  .uploading { font-size: 13px; color: var(--muted); padding: 0 16px 10px; }
  .placeholder { flex: 1; display: grid; place-content: center; justify-items: center; gap: 6px; color: var(--muted);
    padding: 20px; text-align: center; }
  .placeholder .big { font-size: 64px; animation: float 3s ease-in-out infinite; }
  .placeholder h2 { margin: 6px 0 0; color: var(--text); font-weight: 800; }
  .hint { font-size: 14px; color: var(--muted); text-align: center; padding: 30px 10px; }
  .hint .big { font-size: 44px; display: block; margin-bottom: 6px; }

  /* ---------- Окна ---------- */
  .overlay { position: fixed; inset: 0; background: rgba(20, 12, 40, .45); backdrop-filter: blur(4px);
    display: grid; place-items: center; padding: 16px; z-index: 10; animation: fade .2s ease; }
  .modal { width: 100%; max-width: 420px; max-height: calc(100vh - 32px); overflow-y: auto; background: var(--panel);
    border-radius: 26px; padding: 22px; box-shadow: var(--shadow); display: grid; gap: 14px; animation: pop .25s ease; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; }
  .modal-head h3 { margin: 0; font-size: 20px; font-weight: 800; }
  .section { display: grid; gap: 10px; padding: 14px; background: var(--panel2); border-radius: 18px; }
  .section h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .section input { background: var(--panel); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .row .lbl { font-weight: 700; }
  .row .lbl small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
  .center { display: grid; justify-items: center; gap: 6px; text-align: center; }
  .center .name { font-size: 19px; font-weight: 800; }
  .center .nick { color: var(--muted); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; }
  .swatch.on { border-color: var(--text); }
  .switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .switch span { position: absolute; inset: 0; background: var(--line); border-radius: 999px; transition: .2s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 22px; height: 22px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::before { transform: translateX(20px); }
  .member { display: flex; align-items: center; gap: 10px; }
  .member .n { font-weight: 700; }
  .member .u { color: var(--muted); font-size: 13px; }
  .inline { display: flex; gap: 8px; }
  .inline button { flex-shrink: 0; }

  .lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .85); display: grid; place-items: center;
    z-index: 20; cursor: zoom-out; animation: fade .2s ease; padding: 20px; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 12px; }

  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes float { 50% { transform: translateY(-8px); } }

  /* ---------- Телефон ---------- */
  @media (max-width: 720px) {
    #app { padding: 0; gap: 0; }
    #sidebar, #chat { border-radius: 0; box-shadow: none; }
    #sidebar { width: 100%; }
    #chat { display: none; }
    body.in-chat #sidebar { display: none; }
    body.in-chat #chat { display: flex; }
    #backBtn { display: grid; }
    .bubble { max-width: 85%; }
  }
</style>
</head>
<body>

<!-- Вход / регистрация -->
<section id="auth" class="hidden">
  <form class="card" id="authForm">
    <div class="logo grad">💬</div>
    <h1>Привет! 👋</h1>
    <p class="sub" id="authSub">Рады видеть снова</p>
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">Вход</button>
      <button type="button" id="tabSignup">Регистрация</button>
    </div>
    <input id="username" class="hidden" placeholder="Придумайте ник, например daniil" autocomplete="username" maxlength="24">
    <input id="email" type="email" placeholder="Email" autocomplete="email" required>
    <input id="password" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password" minlength="6" required>
    <button class="primary grad" id="authBtn" type="submit">Войти</button>
    <div class="msg" id="authMsg"></div>
  </form>
</section>

<!-- Основной экран -->
<section id="app" class="hidden">
  <aside id="sidebar">
    <div class="side-head">
      <div class="me">
        <div id="meAvatar"></div>
        <div class="who" id="meWho" title="Настройки"><span class="hi">Привет,</span><b id="meName"></b></div>
        <button class="icon-btn" id="themeBtn" title="Сменить тему">🌙</button>
        <button class="icon-btn" id="settingsBtn" title="Настройки">⚙️</button>
      </div>
      <div class="search-row">
        <form class="find" id="findForm">
          <input id="findInput" placeholder="Ник друга + Enter" autocomplete="off">
        </form>
        <button class="new-group grad" id="newGroupBtn" title="Новая группа">👥</button>
      </div>
      <div class="msg" id="findMsg"></div>
    </div>
    <div class="side-title">Чаты</div>
    <div id="chatList"></div>
  </aside>

  <main id="chat">
    <div class="chat-head">
      <button class="icon-btn" id="backBtn">←</button>
      <div class="info" id="chatInfo" title="О чате">
        <div id="chatAvatar"></div>
        <div style="min-width:0">
          <div class="title" id="chatTitle"></div>
          <div class="status" id="chatStatus"></div>
        </div>
      </div>
    </div>
    <div id="placeholder" class="placeholder">
      <div class="big">💌</div>
      <h2>Тут будут ваши разговоры</h2>
      <div>Выберите чат слева, найдите друга по нику или создайте группу 👥</div>
    </div>
    <div id="messages" class="hidden"></div>
    <div id="uploading" class="uploading hidden">📤 Отправляю фото…</div>
    <form id="composer" class="hidden">
      <label class="attach" title="Отправить фото">📎<input type="file" id="fileInput" accept="image/*" hidden></label>
      <input id="text" type="text" placeholder="Напишите что-нибудь приятное…" autocomplete="off" maxlength="4000">
      <button type="submit" class="send grad" title="Отправить">➤</button>
    </form>
  </main>
</section>

<div id="modalRoot"></div>

<div id="configWarn" class="hidden" style="padding:24px;max-width:560px;margin:40px auto;line-height:1.6">
  <h2>Почти готово</h2>
  <p>Откройте файл <b>config.js</b> и вставьте туда адрес проекта и ключ из Supabase. Подробно — в README.md.</p>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import { SUPABASE_URL, SUPABASE_KEY } from './config.js';

const $ = (id) => document.getElementById(id);
const BUCKET = 'chat-images';
const HUES = [260, 320, 350, 20, 45, 150, 190, 220];

if (SUPABASE_URL.includes('ВАШ') || SUPABASE_KEY.includes('ВАШ')) {
  $('configWarn').classList.remove('hidden');
  throw new Error('config.js не заполнен');
}

const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let me = null;                      // { id, email }
const people = new Map();           // id -> { username, display_name, avatar_hue }
const convs = new Map();            // id -> чат из my_chats()
const history = new Map();          // id чата -> [сообщения]
const urls = new Map();             // путь картинки -> временная ссылка
let activeId = null;
let channel = null;

/* ---------- Настройки на этом устройстве ---------- */
const prefs = { theme: 'light', sound: true, notify: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem('prefs') || '{}')); } catch {}
function savePrefs() { try { localStorage.setItem('prefs', JSON.stringify(prefs)); } catch {} }

function applyTheme() {
  document.body.classList.toggle('dark', prefs.theme === 'dark');
  $('themeBtn').textContent = prefs.theme === 'dark' ? '☀️' : '🌙';
}
applyTheme();
$('themeBtn').onclick = () => { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); };

/* ---------- Вход и регистрация ---------- */
let mode = 'login';
function setMode(m) {
  mode = m;
  $('tabLogin').classList.toggle('on', m === 'login');
  $('tabSignup').classList.toggle('on', m === 'signup');
  $('username').classList.toggle('hidden', m === 'login');
  $('authBtn').textContent = m === 'login' ? 'Войти' : 'Создать аккаунт ✨';
  $('authSub').textContent = m === 'login' ? 'Рады видеть снова' : 'Пара секунд, и вы с нами';
  $('password').autocomplete = m === 'login' ? 'current-password' : 'new-password';
  say('authMsg', '');
}
$('tabLogin').onclick = () => setMode('login');
$('tabSignup').onclick = () => setMode('signup');

function say(id, text, kind = 'err') {
  const el = $(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'msg ' + (text ? kind : '');
}

$('authForm').onsubmit = async (e) => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  $('authBtn').disabled = true;
  try {
    if (mode === 'login') {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const username = $('username').value.trim().toLowerCase();
      if (!/^[a-z0-9_]{3,24}$/.test(username)) throw new Error('Ник: 3–24 символа, латиница, цифры или _');
      const { data: free, error: e1 } = await sb.rpc('username_available', { name: username });
      if (e1) throw e1;
      if (!free) throw new Error('Этот ник уже занят');
      const { data, error } = await sb.auth.signUp({
        email, password,
        options: { data: { username }, emailRedirectTo: location.origin + location.pathname }
      });
      if (error) throw error;
      if (!data.session) say('authMsg', 'Готово! Подтвердите email по ссылке из письма, потом войдите.', 'ok');
    }
  } catch (err) {
    say('authMsg', humanError(err));
  } finally {
    $('authBtn').disabled = false;
  }
};

function humanError(err) {
  const m = (err && err.message) || String(err);
  if (/Invalid login credentials/i.test(m)) return 'Неверный email или пароль';
  if (/Email not confirmed/i.test(m)) return 'Сначала подтвердите email по ссылке из письма';
  if (/already registered/i.test(m)) return 'Этот email уже зарегистрирован';
  if (/rate limit/i.test(m)) return 'Слишком много попыток, подождите немного';
  if (/Failed to fetch/i.test(m)) return 'Нет связи с сервером. Проверьте интернет';
  if (/my_chats|get_or_create_dm|conversation/i.test(m) && /not find|does not exist/i.test(m))
    return 'База не обновлена: запустите update-1.sql в Supabase';
  if (/should be different/i.test(m)) return 'Новый пароль совпадает со старым';
  if (/Password should be/i.test(m)) return 'Пароль слишком короткий (нужно от 6 символов)';
  return m;
}

sb.auth.onAuthStateChange((_event, session) => {
  setTimeout(() => session ? startApp(session.user) : stopApp(), 0);
});

/* ---------- Запуск ---------- */
async function startApp(user) {
  if (me && me.id === user.id) return;
  me = { id: user.id, email: user.email };
  await loadPeople([me.id]);
  if (!people.has(me.id)) people.set(me.id, { username: user.user_metadata?.username || 'me' });

  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  renderMe();
  await loadChats();
  subscribe();
}

function stopApp() {
  me = null; activeId = null;
  convs.clear(); history.clear(); people.clear(); urls.clear();
  if (channel) { sb.removeChannel(channel); channel = null; }
  closeModal();
  $('app').classList.add('hidden');
  $('auth').classList.remove('hidden');
  document.body.classList.remove('in-chat');
  showPlaceholder();
  document.title = 'Мессенджер';
}

function renderMe() {
  const p = people.get(me.id);
  $('meName').textContent = p.display_name || '@' + p.username;
  $('meAvatar').innerHTML = avatarOf(me.id, 'sm');
}

/* ---------- Люди ---------- */
async function loadPeople(ids) {
  const missing = [...new Set(ids)].filter((id) => id && !people.has(id));
  if (!missing.length) return;
  const { data } = await sb.from('profiles').select('id, username, display_name, avatar_hue').in('id', missing);
  for (const p of data || []) people.set(p.id, p);
}
const nameOf = (id) => { const p = people.get(id); return p ? (p.display_name || p.username) : '…'; };
const nickOf = (id) => '@' + (people.get(id)?.username || '');

function hueFor(text) { let h = 0; for (const ch of text) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function avatarHTML(label, hue, size = '', extra = '') {
  const bg = `linear-gradient(135deg, hsl(${hue} 80% 66%), hsl(${(hue + 40) % 360} 75% 58%))`;
  return `<div class="avatar ${size}" style="background:${bg}">${esc((label[0] || '?').toUpperCase())}${extra}</div>`;
}
function avatarOf(userId, size = '') {
  const p = people.get(userId) || {};
  const label = p.display_name || p.username || '?';
  return avatarHTML(label, p.avatar_hue ?? hueFor(p.username || label), size);
}

/* ---------- Чаты ---------- */
const otherOf = (c) => (c.member_ids || []).find((id) => id !== me.id);
const titleOf = (c) => c.is_group ? (c.title || 'Группа') : nameOf(otherOf(c));
function convAvatar(c, size = '') {
  if (!c.is_group) return avatarOf(otherOf(c), size);
  return avatarHTML(c.title || 'Г', hueFor(c.title || 'Г'), size, '<span class="grp">👥</span>');
}
const ts = (x) => x ? Date.parse(x) : 0;
const isUnread = (c) => c.last_sender && c.last_sender !== me.id && ts(c.last_read_at) < ts(c.last_message_at);

async function loadChats() {
  const { data, error } = await sb.rpc('my_chats');
  if (error) { $('chatList').innerHTML = `<div class="empty">⚠️ ${esc(humanError(error))}</div>`; return; }
  convs.clear();
  for (const c of data) convs.set(c.id, c);
  await loadPeople(data.flatMap((c) => c.member_ids || []));
  renderChats();
}

function renderChats() {
  const list = $('chatList');
  const items = [...convs.values()].sort((a, b) => ts(b.last_message_at) - ts(a.last_message_at));
  const unread = items.filter(isUnread).length;
  document.title = unread ? `(${unread}) Мессенджер` : 'Мессенджер';
  if (!items.length) {
    list.innerHTML = '<div class="empty"><span class="big">🌱</span>Чатов пока нет.<br>Впишите ник друга в поиск или создайте группу 👥</div>';
    return;
  }
  list.innerHTML = '';
  for (const c of items) {
    const el = document.createElement('div');
    const un = isUnread(c) && c.id !== activeId;
    el.className = 'chat-item' + (c.id === activeId ? ' active' : '') + (un ? ' unread' : '');
    el.innerHTML = `${convAvatar(c)}
      <div class="chat-meta">
        <div class="chat-name"><span></span><small></small></div>
        <div class="chat-last"></div>
      </div>${un ? '<span class="dot"></span>' : ''}`;
    el.querySelector('.chat-name span').textContent = titleOf(c);
    el.querySelector('.chat-name small').textContent = c.last_sender ? timeShort(c.last_message_at) : '';
    el.querySelector('.chat-last').textContent = preview(c);
    el.onclick = () => openChat(c.id);
    list.appendChild(el);
  }
}

function preview(c) {
  if (!c.last_sender) return c.is_group ? 'Группа создана 🎉' : 'Новый чат';
  const who = c.last_sender === me.id ? 'Вы: ' : (c.is_group ? nameOf(c.last_sender) + ': ' : '');
  const body = c.last_image ? '📷 ' + (c.last_content || 'Фото') : c.last_content;
  return who + body;
}

/* ---------- Поиск по нику → личный чат ---------- */
$('findForm').onsubmit = async (e) => {
  e.preventDefault();
  const q = $('findInput').value.trim().toLowerCase().replace(/^@/, '');
  if (!q) return;
  if (q === people.get(me.id).username) return say('findMsg', 'Это же вы 😄');
  const { data, error } = await sb.from('profiles').select('id, username, display_name, avatar_hue').eq('username', q).maybeSingle();
  if (error) return say('findMsg', humanError(error));
  if (!data) return say('findMsg', 'Не нашли @' + q + ' 🤔 Проверьте ник');
  people.set(data.id, data);
  const { data: convId, error: e2 } = await sb.rpc('get_or_create_dm', { other: data.id });
  if (e2) return say('findMsg', humanError(e2));
  say('findMsg', '');
  $('findInput').value = '';
  await loadChats();
  openChat(convId);
};

/* ---------- Открытый чат ---------- */
function showPlaceholder() {
  $('placeholder').classList.remove('hidden');
  $('messages').classList.add('hidden');
  $('composer').classList.add('hidden');
  $('uploading').classList.add('hidden');
  $('chatTitle').textContent = '';
  $('chatStatus').textContent = '';
  $('chatAvatar').innerHTML = '';
}

function renderHeader() {
  const c = convs.get(activeId);
  if (!c) return;
  $('chatTitle').textContent = titleOf(c);
  $('chatAvatar').innerHTML = convAvatar(c, 'sm');
  const n = (c.member_ids || []).length;
  $('chatStatus').textContent = c.is_group ? `${n} ${plural(n, 'участник', 'участника', 'участников')} · нажмите для настроек`
                                           : nickOf(otherOf(c));
}

async function openChat(id) {
  if (!convs.has(id)) await loadChats();
  if (!convs.has(id)) return;
  activeId = id;
  document.body.classList.add('in-chat');
  $('placeholder').classList.add('hidden');
  $('messages').classList.remove('hidden');
  $('composer').classList.remove('hidden');
  renderHeader();
  markRead(id);
  renderChats();

  if (!history.has(id)) {
    $('messages').innerHTML = '<div class="day">Загрузка…</div>';
    const { data, error } = await sb.from('messages').select('*')
      .eq('conversation_id', id).order('created_at', { ascending: false }).limit(200);
    if (error) { $('messages').innerHTML = `<div class="day">⚠️ ${esc(error.message)}</div>`; return; }
    const merged = new Map([...(history.get(id) || []), ...data.reverse()].map((m) => [m.id, m]));
    history.set(id, [...merged.values()].sort((a, b) => ts(a.created_at) - ts(b.created_at)));
    await loadPeople(history.get(id).map((m) => m.sender_id));
  }
  if (activeId === id) { renderMessages(); if (matchMedia('(min-width: 721px)').matches) $('text').focus(); }
}

$('backBtn').onclick = () => {
  document.body.classList.remove('in-chat');
  activeId = null;
  showPlaceholder();
  renderChats();
};
$('chatInfo').onclick = () => { if (activeId) openChatInfo(activeId); };

async function markRead(id) {
  const c = convs.get(id);
  if (!c || document.hidden) return;
  c.last_read_at = new Date(Math.max(Date.now(), ts(c.last_message_at))).toISOString();
  await sb.from('conversation_members').update({ last_read_at: c.last_read_at })
    .eq('conversation_id', id).eq('user_id', me.id);
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && activeId) { markRead(activeId); renderChats(); }
});

function renderMessages() {
  const box = $('messages');
  const c = convs.get(activeId);
  const list = history.get(activeId) || [];
  box.innerHTML = '';
  if (!list.length) {
    box.innerHTML = `<div class="hint"><span class="big">👋</span>${c?.is_group ? 'Группа готова! Напишите первое сообщение.' : 'Начните разговор, скажите «привет»!'}</div>`;
  }
  let lastDay = '', prevSender = null;
  for (const m of list) {
    const day = new Date(m.created_at).toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
    if (day !== lastDay) {
      const d = document.createElement('div');
      d.className = 'day'; d.textContent = day; box.appendChild(d);
      lastDay = day; prevSender = null;
    }
    box.appendChild(bubble(m, c?.is_group && m.sender_id !== me.id && m.sender_id !== prevSender));
    prevSender = m.sender_id;
  }
  resolveImages(box);
  box.scrollTop = box.scrollHeight;
}

function bubble(m, showName) {
  const el = document.createElement('div');
  el.className = 'bubble' + (m.sender_id === me.id ? ' mine' : '') + (m.image_path ? ' photo' : '');
  if (showName) {
    const f = document.createElement('div');
    f.className = 'from';
    const p = people.get(m.sender_id);
    f.style.color = `hsl(${p?.avatar_hue ?? hueFor(p?.username || '')} 65% 50%)`;
    f.textContent = nameOf(m.sender_id);
    el.appendChild(f);
  }
  if (m.image_path) {
    const img = document.createElement('img');
    img.dataset.path = m.image_path;
    img.alt = 'Фото';
    img.onclick = () => img.src && openLightbox(img.src);
    img.onload = () => { const b = $('messages'); if (b.scrollHeight - b.scrollTop - b.clientHeight < 400) b.scrollTop = b.scrollHeight; };
    el.appendChild(img);
  }
  if (m.content) {
    const t = document.createElement('div');
    if (m.image_path) t.className = 'cap';
    t.textContent = m.content;
    el.appendChild(t);
  }
  const time = document.createElement('time');
  time.textContent = new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  el.appendChild(time);
  return el;
}

async function resolveImages(root) {
  const imgs = [...root.querySelectorAll('img[data-path]')];
  const need = [...new Set(imgs.map((i) => i.dataset.path).filter((p) => !urls.has(p)))];
  if (need.length) {
    const { data } = await sb.storage.from(BUCKET).createSignedUrls(need, 60 * 60 * 6);
    for (const r of data || []) if (r.signedUrl) urls.set(r.path, r.signedUrl);
  }
  for (const i of imgs) if (urls.has(i.dataset.path)) i.src = urls.get(i.dataset.path);
}

function openLightbox(src) {
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `<img src="${esc(src)}" alt="">`;
  lb.onclick = () => lb.remove();
  document.body.appendChild(lb);
}

/* ---------- Отправка ---------- */
$('composer').onsubmit = async (e) => {
  e.preventDefault();
  const input = $('text');
  const content = input.value.trim();
  if (!content || !activeId) return;
  input.value = '';
  const { data, error } = await sb.from('messages')
    .insert({ conversation_id: activeId, sender_id: me.id, content }).select().single();
  if (error) { input.value = content; alertInline('Не отправилось: ' + humanError(error)); return; }
  addMessage(data);
};

$('fileInput').onchange = () => {
  const f = $('fileInput').files[0];
  $('fileInput').value = '';
  if (f) sendImage(f);
};
$('text').addEventListener('paste', (e) => {
  const f = [...(e.clipboardData?.files || [])].find((x) => x.type.startsWith('image/'));
  if (f) { e.preventDefault(); sendImage(f); }
});

async function sendImage(file) {
  if (!activeId) return;
  if (!file.type.startsWith('image/')) return alertInline('Можно отправлять только картинки');
  const convId = activeId;
  const caption = $('text').value.trim();
  $('uploading').classList.remove('hidden');
  try {
    const { blob, ext, type } = await shrink(file);
    if (blob.size > 5 * 1024 * 1024) throw new Error('Картинка больше 5 МБ');
    const path = `${convId}/${crypto.randomUUID()}.${ext}`;
    const { error: upErr } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: type });
    if (upErr) throw upErr;
    const { data, error } = await sb.from('messages')
      .insert({ conversation_id: convId, sender_id: me.id, content: caption, image_path: path }).select().single();
    if (error) throw error;
    if (caption) $('text').value = '';
    addMessage(data);
  } catch (err) {
    alertInline('Фото не отправилось: ' + humanError(err));
  } finally {
    $('uploading').classList.add('hidden');
  }
}

// Уменьшаем фото до 1600 px, чтобы экономить бесплатный 1 ГБ
async function shrink(file) {
  if (file.type === 'image/gif') return { blob: file, ext: 'gif', type: 'image/gif' };
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.82));
  return { blob, ext: 'jpg', type: 'image/jpeg' };
}

function alertInline(text) {
  const box = $('messages');
  const d = document.createElement('div');
  d.className = 'day'; d.style.color = 'var(--err)'; d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

/* ---------- Реальное время ---------- */
function subscribe() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('inbox-' + me.id)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' },
        (p) => addMessage(p.new, true))
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'conversation_members', filter: `user_id=eq.${me.id}` },
        () => loadChats())
    .subscribe();
}

async function addMessage(m, fromServer = false) {
  if (!me) return;
  let c = convs.get(m.conversation_id);
  if (!c) { await loadChats(); c = convs.get(m.conversation_id); if (!c) return; }
  await loadPeople([m.sender_id]);

  const h = history.get(c.id);
  const isNew = !h || !h.some((x) => x.id === m.id);
  if (h && isNew) { h.push(m); h.sort((x, y) => ts(x.created_at) - ts(y.created_at)); }

  if (!c.last_message_at || ts(c.last_message_at) <= ts(m.created_at)) {
    c.last_message_at = m.created_at;
    c.last_content = m.content;
    c.last_sender = m.sender_id;
    c.last_image = !!m.image_path;
  }
  if (m.sender_id === me.id) c.last_read_at = m.created_at;

  if (c.id === activeId) {
    if (h) renderMessages();
    if (m.sender_id !== me.id) markRead(c.id);
  }
  if (fromServer && isNew && m.sender_id !== me.id) notify(c, m);
  renderChats();
}

/* ---------- Звук и уведомления ---------- */
let audioCtx = null;
function ding() {
  try {
    audioCtx = audioCtx || new AudioContext();
    const t = audioCtx.currentTime;
    for (const [i, f] of [[0, 880], [0.12, 1320]]) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t + i);
      g.gain.exponentialRampToValueAtTime(0.18, t + i + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i + 0.25);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + i); o.stop(t + i + 0.3);
    }
  } catch {}
}

function notify(c, m) {
  const visibleHere = c.id === activeId && !document.hidden;
  if (visibleHere) return;
  if (prefs.sound) ding();
  if (prefs.notify && document.hidden && 'Notification' in window && Notification.permission === 'granted') {
    const body = (c.is_group ? nameOf(m.sender_id) + ': ' : '') + (m.image_path ? '📷 Фото' : m.content);
    try {
      const n = new Notification(titleOf(c), { body, tag: c.id });
      n.onclick = () => { window.focus(); openChat(c.id); n.close(); };
    } catch {}
  }
}

/* ---------- Окна ---------- */
function openModal(html) {
  $('modalRoot').innerHTML = `<div class="overlay" id="overlay"><div class="modal">${html}</div></div>`;
  $('overlay').addEventListener('mousedown', (e) => { if (e.target.id === 'overlay') closeModal(); });
  $('modalRoot').querySelectorAll('[data-close]').forEach((b) => b.onclick = closeModal);
}
function closeModal() { $('modalRoot').innerHTML = ''; }
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); document.querySelector('.lightbox')?.remove(); } });
const closeBtn = '<button class="icon-btn" data-close title="Закрыть">✕</button>';
const parseNicks = (s) => s.split(/[\s,;]+/).map((x) => x.replace(/^@/, '').toLowerCase()).filter(Boolean);

/* Новая группа */
$('newGroupBtn').onclick = () => {
  openModal(`
    <div class="modal-head"><h3>Новая группа 👥</h3>${closeBtn}</div>
    <input id="gTitle" placeholder="Название, например «Друзья»" maxlength="60">
    <input id="gNicks" placeholder="Ники участников через пробел: anya max_dev">
    <button class="primary grad" id="gCreate">Создать группу</button>
    <div class="msg" id="gMsg"></div>`);
  $('gTitle').focus();
  $('gCreate').onclick = async () => {
    const title = $('gTitle').value.trim();
    const nicks = parseNicks($('gNicks').value);
    if (!title) return say('gMsg', 'Придумайте название группы');
    $('gCreate').disabled = true;
    const { data: missing } = await checkNicks(nicks);
    const { data, error } = await sb.rpc('create_group', { group_title: title, usernames: nicks });
    $('gCreate').disabled = false;
    if (error) return say('gMsg', humanError(error));
    closeModal();
    await loadChats();
    await openChat(data);
    if (missing.length) alertInline('Не нашли: ' + missing.map((n) => '@' + n).join(', '));
  };
};

async function checkNicks(nicks) {
  if (!nicks.length) return { data: [] };
  const { data } = await sb.from('profiles').select('username').in('username', nicks);
  const found = new Set((data || []).map((p) => p.username));
  return { data: nicks.filter((n) => !found.has(n)) };
}

/* О чате */
function openChatInfo(id) {
  const c = convs.get(id);
  if (!c) return;
  if (!c.is_group) {
    const o = otherOf(c);
    openModal(`
      <div class="modal-head"><h3>Профиль</h3>${closeBtn}</div>
      <div class="center">${avatarOf(o, 'lg')}<div class="name"></div><div class="nick"></div></div>`);
    document.querySelector('.modal .name').textContent = nameOf(o);
    document.querySelector('.modal .nick').textContent = nickOf(o);
    return;
  }
  openModal(`
    <div class="modal-head"><h3>Группа</h3>${closeBtn}</div>
    <div class="center">${convAvatar(c, 'lg')}</div>
    <div class="section">
      <h4>Название</h4>
      <div class="inline"><input id="rTitle" maxlength="60"><button class="secondary" id="rSave">Сохранить</button></div>
    </div>
    <div class="section">
      <h4>Участники</h4>
      <div id="mList" style="display:grid;gap:10px"></div>
      <div class="inline"><input id="addNicks" placeholder="Добавить по нику"><button class="secondary" id="addBtn">＋</button></div>
    </div>
    <div class="msg" id="iMsg"></div>
    <button class="secondary danger" id="leaveBtn">🚪 Выйти из группы</button>`);
  $('rTitle').value = c.title || '';
  const list = $('mList');
  for (const uid of c.member_ids || []) {
    const row = document.createElement('div');
    row.className = 'member';
    row.innerHTML = `${avatarOf(uid, 'xs')}<div><div class="n"></div><div class="u"></div></div>`;
    row.querySelector('.n').textContent = nameOf(uid) + (uid === me.id ? ' (вы)' : '');
    row.querySelector('.u').textContent = nickOf(uid);
    list.appendChild(row);
  }
  $('rSave').onclick = async () => {
    const { error } = await sb.rpc('rename_group', { conv: id, new_title: $('rTitle').value });
    if (error) return say('iMsg', humanError(error));
    await loadChats(); renderHeader(); say('iMsg', 'Название сохранено ✨', 'ok');
  };
  $('addBtn').onclick = async () => {
    const nicks = parseNicks($('addNicks').value);
    if (!nicks.length) return;
    const { data: missing } = await checkNicks(nicks);
    const { error } = await sb.rpc('add_group_members', { conv: id, usernames: nicks });
    if (error) return say('iMsg', humanError(error));
    await loadChats(); renderHeader(); openChatInfo(id);
    say('iMsg', missing.length ? 'Не нашли: ' + missing.map((n) => '@' + n).join(', ') : 'Добавили 🎉', missing.length ? 'err' : 'ok');
  };
  $('leaveBtn').onclick = async () => {
    if (!confirm('Выйти из группы «' + (c.title || '') + '»?')) return;
    const { error } = await sb.from('conversation_members').delete().eq('conversation_id', id).eq('user_id', me.id);
    if (error) return say('iMsg', humanError(error));
    closeModal();
    convs.delete(id); history.delete(id);
    activeId = null; document.body.classList.remove('in-chat');
    showPlaceholder(); renderChats();
  };
}

    </div>
    <div class="msg" id="sMsg"></div>
    <button class="secondary danger" id="sLogout">🚪 Выйти из аккаунта</button>`);

  document.querySelector('.modal .nick').textContent = '@' + p.username;
  $('sName').value = p.display_name || '';
  $('sEmail').textContent = me.email || '';
  $('sDark').checked = prefs.theme === 'dark';
  $('sSound').checked = prefs.sound;
  $('sNotify').checked = prefs.notify && 'Notification' in window && Notification.permission === 'granted';

  const drawAv = () => { $('sAv').innerHTML = avatarHTML($('sName').value.trim() || p.username, hue, 'lg'); };
  const drawHues = () => {
    $('sHues').innerHTML = '';
    for (const h of HUES) {
      const b = document.createElement('button');
      b.className = 'swatch' + (h === hue ? ' on' : '');
      b.style.background = `linear-gradient(135deg, hsl(${h} 80% 66%), hsl(${(h + 40) % 360} 75% 58%))`;
      b.onclick = () => { hue = h; drawHues(); drawAv(); };
      $('sHues').appendChild(b);
    }
  };
  drawAv(); drawHues();
  $('sName').oninput = drawAv;

  $('sSave').onclick = async () => {
    const display_name = $('sName').value.trim() || null;
    const { error } = await sb.from('profiles').update({ display_name, avatar_hue: hue }).eq('id', me.id);
    if (error) return say('sMsg', humanError(error));
    Object.assign(p, { display_name, avatar_hue: hue });
    renderMe(); renderChats(); if (activeId) { renderHeader(); renderMessages(); }
    say('sMsg', 'Профиль сохранён ✨', 'ok');
  };
  $('sDark').onchange = () => { prefs.theme = $('sDark').checked ? 'dark' : 'light'; savePrefs(); applyTheme(); };
  $('sSound').onchange = () => { prefs.sound = $('sSound').checked; savePrefs(); if (prefs.sound) ding(); };
  $('sNotify').onchange = async () => {
    if ($('sNotify').checked) {
      if (!('Notification' in window)) { $('sNotify').checked = false; return say('sMsg', 'Браузер не поддерживает уведомления'); }
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') { $('sNotify').checked = false; return say('sMsg', 'Разрешите уведомления в настройках браузера'); }
    }
    prefs.notify = $('sNotify').checked; savePrefs();
  };
  $('sPassBtn').onclick = async () => {
    const password = $('sPass').value;
    if (password.length < 6) return say('sMsg', 'Пароль должен быть от 6 символов');
    const { error } = await sb.auth.updateUser({ password });
    if (error) return say('sMsg', humanError(error));
    $('sPass').value = '';
    say('sMsg', 'Пароль изменён 🔐', 'ok');
  };
  $('sLogout').onclick = () => sb.auth.signOut();
}

/* ---------- Мелочи ---------- */
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function plural(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function timeShort(iso) {
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })
    : d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}

const { data: { session } } = await sb.auth.getSession();
if (!session) $('auth').classList.remove('hidden');
</script>
